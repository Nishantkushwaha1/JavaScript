<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <input type="text" placeholder="0" class="zero" id="display">

        <div class="AC">
            <div class="circle" id="all_clear">AC</div>
            <div class="circle" id="delete">DEL</div>
            <div class="circle" id="percent">%</div>
            <div class="circle" id="division">/</div>
        </div>

        <div class="seven">
            <div class="circle">7</div>
            <div class="circle">8</div>
            <div class="circle">9</div>
            <div class="circle" id="multiply">*</div>
        </div>

        <div class="four">
            <div class="circle">4</div>
            <div class="circle">5</div>
            <div class="circle">6</div>
            <div class="circle" id="minus">-</div>
        </div>

        <div class="one">
            <div class="circle">1</div>
            <div class="circle">2</div>
            <div class="circle">3</div>
            <div class="circle" id="sum">+</div>
        </div>
        
        <div class="double_zero">
            <div class="circle">00</div>
            <div class="circle">0</div>
            <div class="circle" id="dot">.</div>
            <div class="circle" id="equalto">=</div>
        </div>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
